<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In – Barikhuji</title>
<link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/auth.css">
</head>
<body class="bk-auth-page">
<div id="site-header"></div>
<main id="main" class="bk-auth-main">
  <section class="bk-auth-shell" data-unified-auth data-initial-mode="login" aria-labelledby="auth-heading">
    <div class="bk-auth-visual">
      <a class="bk-auth-brand" href="index.html" aria-label="Barikhuji home">
        <span class="bk-auth-brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
        </span>
        <span class="bk-auth-brand-text">Bari<span>khuji</span></span>
      </a>
      <div class="bk-auth-copy">
        <h2>Find your next home.</h2>
        <p>Verified apartments, rooms, and family-friendly rentals across Bangladesh.</p>
      </div>
    </div>

    <div class="bk-auth-panel">
      <div class="bk-auth-box">
        <h1 id="auth-heading">Welcome back.</h1>
        <p id="auth-sub" class="bk-auth-sub">Sign in to view your saved homes, bookings, and landlord messages.</p>

        <span class="bk-role-label" id="role-label">Continue as</span>
        <div class="bk-role-group" role="radiogroup" aria-labelledby="role-label">
          <button type="button" class="bk-role-btn" role="radio" aria-checked="true" data-role-option="customer">
            <strong>Renter</strong>
            <small>Find &amp; book homes</small>
          </button>
          <button type="button" class="bk-role-btn" role="radio" aria-checked="false" data-role-option="landlord">
            <strong>Landlord</strong>
            <small>List &amp; manage homes</small>
          </button>
        </div>

        <p id="form-status" class="notice" role="status" hidden></p>

        <form id="auth-login-form" novalidate>
          <div class="field">
            <label for="login-email">Email *</label>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <span class="err" id="login-email-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="login-password">Password *</label>
            <div class="bk-pw-wrap">
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button type="button" class="bk-pw-toggle" data-pw-toggle="login-password" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <span class="err" id="login-password-err" aria-live="polite"></span>
          </div>
          <button class="bk-auth-submit" type="submit">Sign in as Renter</button>
        </form>

        <form id="auth-register-form" novalidate hidden>
          <div class="field">
            <label for="reg-fullName">Full name *</label>
            <input id="reg-fullName" name="fullName" type="text" autocomplete="name" placeholder="Your full name" required minlength="3">
            <span class="err" id="reg-fullName-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="reg-email">Email *</label>
            <input id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <span class="err" id="reg-email-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="reg-phone">Mobile number *</label>
            <input id="reg-phone" name="phone" type="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required data-bdphone>
            <span class="err" id="reg-phone-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="reg-password">Password * (min 8 characters)</label>
            <div class="bk-pw-wrap">
              <input id="reg-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
              <button type="button" class="bk-pw-toggle" data-pw-toggle="reg-password" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <span class="err" id="reg-password-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label for="reg-confirmPassword">Confirm password *</label>
            <div class="bk-pw-wrap">
              <input id="reg-confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
              <button type="button" class="bk-pw-toggle" data-pw-toggle="reg-confirmPassword" aria-label="Show password" aria-pressed="false"></button>
            </div>
            <span class="err" id="reg-confirmPassword-err" aria-live="polite"></span>
          </div>
          <div class="field">
            <label class="bk-auth-terms">
              <input id="reg-terms" name="terms" type="checkbox">
              <span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a></span>
            </label>
            <span class="err" id="reg-terms-err" aria-live="polite"></span>
          </div>
          <button class="bk-auth-submit" type="submit">Create Renter account</button>
        </form>

        <p id="switch-to-register" class="bk-auth-switch">
          Don&apos;t have an account? <button type="button" class="bk-auth-switch-btn" data-switch-mode="register">Create an account</button>
        </p>
        <p id="switch-to-login" class="bk-auth-switch" hidden>
          Already have an account? <button type="button" class="bk-auth-switch-btn" data-switch-mode="login">Sign in</button>
        </p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/components.js"></script>
<script src="js/validation.js"></script>
<script src="js/http.js"></script>
<script src="js/api-account.js"></script>
<script src="js/pages/auth.js"></script>
</body></html>
