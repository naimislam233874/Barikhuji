<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landlord Sign In – Barikhuji</title>
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/dashboard.css">
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  qs.set("role", "landlord");
  qs.set("mode", "login");
  location.replace("../login.html?" + qs.toString());
})();
</script>
</head>
<body data-root="../">
<div id="site-header"></div>
<main id="main" class="section"><div class="container">
<div class="auth-card">
  <h1>Sign in to Barikhuji</h1>
  <p>We have unified Renter and Landlord sign-in into a single page.</p>
  <a class="btn" href="../login.html?role=landlord">Continue to Landlord Sign In</a>
</div></div></main>
<div id="site-footer"></div>
<script src="../js/config.js"></script>
<script src="../js/components.js"></script>
</body></html>
